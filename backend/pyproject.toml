[project]
name = "iris-backend"
version = "0.1.0"
description = "Local-first, on-device photo library backend (FastAPI + ONNX Runtime + SQLite)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# NOTE: versions are intentionally left unpinned during scaffolding.
# Run `uv lock` / `uv sync` once the environment is validated on Apple Silicon.
#
# The heavy ML/CV stack lives in the optional `ml` group below — it is NOT part
# of the default install. Phases 0-1 (foundation, ingest, thumbs, grid) need only
# the lean core here; install the ML stack with `uv sync --extra ml` at Phase 2.
# This keeps the harness/CI fast and avoids blocking foundation work on the
# paddlepaddle / insightface Apple-Silicon build issues flagged in ARCHITECTURE §10.
dependencies = [
    # --- Web / API ---
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",

    # --- Data / storage ---
    # SQLite (WAL mode) is used via the stdlib `sqlite3` module.
    "aiosqlite",
    "numpy",
    "pillow",
    "pillow-heif",          # HEIC/HEIF decode (registers a Pillow opener)
    "blake3",               # content-addressing / file identity (Phase 1)
]

[project.scripts]
iris-sidecar = "iris.app:main"

# ML/CV stack, split by phase so each install pulls only what it needs and we don't
# block earlier phases on the paddlepaddle/insightface Apple-Silicon build issues
# flagged in ARCHITECTURE §10.
[project.optional-dependencies]
# Phase 2 — embeddings + semantic search. Lean; no torch. `uv sync --extra embed`.
embed = [
    "onnxruntime",          # CoreML execution provider ships in the macOS wheel
    "hnswlib",              # vector index (compiles from source on some platforms)
    "transformers",         # CLIP/SigLIP tokenizer (no torch needed for tokenization)
    "huggingface-hub",      # first-run model download into the app models/ dir
]

# Phase 3 — faces.
faces = [
    "insightface",          # SCRFD (detection) + ArcFace (recognition)
    "opencv-python-headless",
]

# Phase 4 — OCR. Apple's Vision framework (native, on-device, Apple-Silicon-fast) via
# ocrmac, replacing the originally-planned PaddleOCR whose paddlepaddle wheel is unreliable
# on ARM Macs (see ARCHITECTURE §6/§10). macOS-only; the OCR stage skips on other hosts.
ocr = [
    "ocrmac",               # thin wrapper over Vision (pulls pyobjc); macOS only
]

# Phase 4 — offline place-name search (ARCHITECTURE §4). geonamescache bundles ~34k
# world cities (name/lat/lon/population) as package data — no runtime download, fully
# offline. Optional: place search degrades gracefully to unavailable when absent.
geo = [
    "geonamescache",
]

# Everything (for full local installs / packaging). `uv sync --extra ml`.
ml = [
    "onnxruntime", "hnswlib", "transformers", "huggingface-hub",
    "insightface", "opencv-python-headless", "ocrmac", "geonamescache",
    "open-clip-torch",      # torch-based CLIP (optional; e.g. offline model export)
]

# Packaging the Python sidecar into a standalone binary.
packaging = [
    "pyinstaller",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "httpx",  # required by starlette/fastapi TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ANN",           # flake8-annotations (type hints required)
]
ignore = [
    "ANN401",        # allow explicit Any where unavoidable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # relax annotation strictness in tests

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "blake3.*", "aiosqlite.*", "pillow_heif.*",
    "onnxruntime.*", "hnswlib.*", "transformers.*", "huggingface_hub.*",
    "insightface.*", "cv2.*", "ocrmac.*", "geonamescache.*",
]
ignore_missing_imports = true
