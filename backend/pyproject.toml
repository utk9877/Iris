[project]
name = "iris-backend"
version = "0.1.0"
description = "Local-first, on-device photo library backend (FastAPI + ONNX Runtime + SQLite)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# NOTE: versions are intentionally left unpinned during scaffolding.
# Run `uv lock` / `uv sync` once the environment is validated on Apple Silicon.
#
# The heavy ML/CV stack lives in the optional `ml` group below — it is NOT part
# of the default install. Phases 0-1 (foundation, ingest, thumbs, grid) need only
# the lean core here; install the ML stack with `uv sync --extra ml` at Phase 2.
# This keeps the harness/CI fast and avoids blocking foundation work on the
# paddlepaddle / insightface Apple-Silicon build issues flagged in ARCHITECTURE §10.
dependencies = [
    # --- Web / API ---
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",

    # --- Data / storage ---
    # SQLite (WAL mode) is used via the stdlib `sqlite3` module.
    "aiosqlite",
    "numpy",
    "pillow",
    "blake3",               # content-addressing / file identity (Phase 1)
]

[project.scripts]
iris-sidecar = "iris.app:main"

[project.optional-dependencies]
# Heavy ML/CV inference stack. Install at Phase 2: `uv sync --extra ml`.
ml = [
    "onnxruntime",          # CoreML execution provider ships in the macOS wheel
    "transformers",         # tokenizers + processors for CLIP / SigLIP
    "open-clip-torch",      # CLIP/SigLIP + LAION aesthetic predictor building blocks
    "insightface",          # SCRFD (detection) + ArcFace (recognition)
    "opencv-python-headless",
    "paddleocr",            # OCR (pulls paddlepaddle; verify Apple Silicon wheel)
    "hnswlib",              # vector index (compiles from source on some platforms)
]

# Packaging the Python sidecar into a standalone binary.
packaging = [
    "pyinstaller",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "httpx",  # required by starlette/fastapi TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ANN",           # flake8-annotations (type hints required)
]
ignore = [
    "ANN401",        # allow explicit Any where unavoidable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # relax annotation strictness in tests

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["blake3.*", "aiosqlite.*"]
ignore_missing_imports = true
