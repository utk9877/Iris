name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Core + dev + the Phase 2 `embed` extra (onnxruntime/hnswlib/tokenizer).
      # The heavier `faces`/`ocr` extras stay out of CI until their phases.
      - run: uv sync --extra embed
      # hnswlib's prebuilt Linux wheel embeds AVX instructions some runner CPUs lack,
      # SIGILL-ing at import. Rebuild it from source (its setup uses -march=native, so
      # it targets this runner's CPU). Verified via the CI import-bisection in history.
      - name: rebuild hnswlib from source
        env:
          UV_NO_BINARY_PACKAGE: hnswlib
        run: uv pip install --no-cache --reinstall-package hnswlib hnswlib
      - run: uv run python -c "import hnswlib; print('hnswlib import OK')"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    name: frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build # tsc --noEmit-equivalent typecheck + vite build (no Rust)
